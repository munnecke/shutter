; Acoustic Shutter Diagnostic Bench — XIAO ESP32S3
;
; This needs Arduino-ESP32 core 3.x (ESP-IDF 5.x). The official `espressif32`
; platform in the PlatformIO registry still ships core 2.x, which has no
; esp_adc/adc_continuous driver, so we use the pioarduino fork. Check
; github.com/pioarduino/platform-espressif32/releases for the newest tag and
; bump the URL below if you want a later core.

[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ESP32Async/AsyncTCP @ ^3.4.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.2.0
